version: '3'

services:
  payload:
    image: node:18-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install && pnpm dev"
    depends_on:
      - postgres
    env_file:
      - .env

  # Uncomment the following to use postgres
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: payload_auth_base
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - payload_auth_base:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d payload_auth_base"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  data:
  payload_auth_base:
  node_modules:
